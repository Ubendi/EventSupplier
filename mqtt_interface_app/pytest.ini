[pytest]
# Test configuration for mqtt_interface_app

# Test discovery
python_files = test_*.py
python_classes = Test*
python_functions = test_*

# Verbosity
addopts = -v

# Output formatting
showlocals = true

# Async support
asyncio_mode = auto

# Coverage options (if pytest-cov is installed)
# addopts = --cov=vlc_interface --cov=tests --cov-report=term --cov-report=html

# Markers
markers =
    slow: marks tests as slow (deselect with '-m "not slow"')
    integration: marks integration tests
    unit: marks unit tests

# Test paths
testpaths = tests
