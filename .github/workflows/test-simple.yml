name: Python Tests (Simple)

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'mqtt_interface_app/requirements*.txt'

      - name: Install dependencies
        run: |
          cd mqtt_interface_app
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock

      - name: Run unit tests
        run: |
          cd mqtt_interface_app
          export PYTHONPATH=.
          python -m pytest tests/test_vlc_main.py -v -p no:warnings
