name: Python Tests with Coverage

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Tests with Coverage
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: 'pip'
          cache-dependency-path: 'mqtt_interface_app/requirements*.txt'

      - name: Install dependencies
        run: |
          cd mqtt_interface_app
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock pytest-cov

      - name: Run tests with coverage
        run: |
          cd mqtt_interface_app
          pytest tests/ -v --cov=vlc_interface --cov=tests --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: mqtt_interface_app/coverage.xml
          fail_ci_if_error: false
        # Only upload coverage once (this job only runs on one Python version)
