name: Python Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: 'pip'
          cache-dependency-path: 'mqtt_interface_app/requirements*.txt'

      - name: Install dependencies
        run: |
          cd mqtt_interface_app
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-mock pytest-cov

      - name: Run tests with coverage
        run: |
          cd mqtt_interface_app
          pytest tests/ -v --cov=vlc_interface --cov=tests --cov-report=xml --cov-report=term

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: mqtt_interface_app/coverage.xml
          fail_ci_if_error: false
        if: matrix.python-version == '3.14'  # Only upload once to avoid duplicate reports

  lint:
    name: Code Linting
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          cd mqtt_interface_app
          pip install ruff

      - name: Run Ruff linter
        run: |
          cd mqtt_interface_app
          ruff check vlc_interface/ tests/ --ignore=E501
          # E501 is line too long - can add later if desired

  type-check:
    name: Type Checking
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: |
          cd mqtt_interface_app
          pip install mypy types-paho-mqtt

      - name: Run mypy type checking
        run: |
          cd mqtt_interface_app
          mypy vlc_interface/vlc_main.py --ignore-missing-imports
